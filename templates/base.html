<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}병원 환자 관리 시스템 (PMS){% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
  </style>
</head>
<body>
  <!-- 상단 네비게이션 바 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">🏥 Hospital PMS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="/reception">환자 접수</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/clinic">진료실</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admission">입·퇴원 관리</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/payment">수납·결제</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 본문 컨테이너 -->
  <div class="container-fluid px-4">
    <!-- 플래시 메시지 (성공/오류 알림) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}
    <!-- 자식 템플릿의 화면이 여기에 렌더링됩니다 -->
    {% endblock %}
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
